<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>灵工云｜社会化灵活用工协同平台</title>
  <style>
    :root{--ink:#152c40;--muted:#657b8d;--line:#dfebf2;--blue:#1477cf;--deep:#0d2b44;--bg:#f7fafc;--card:#fff;--green:#208260}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.brand{display:flex;align-items:center;gap:9px;font-weight:650;font-size:18px}.mark{display:grid;place-items:center;width:29px;height:29px;border-radius:8px;background:var(--blue);color:#fff}.home{min-height:100vh}.home-nav{height:72px;padding:0 max(5vw,28px);display:flex;align-items:center;gap:35px;background:#fff;border-bottom:1px solid var(--line)}.home-nav nav{display:flex;gap:26px;margin-left:auto}.home-nav a{color:#526779;text-decoration:none;font-size:14px}.nav-btn,.secondary{border:1px solid #d3e0e9;border-radius:7px;padding:9px 14px;background:#fff;color:#234763}.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:30px;max-width:1240px;margin:auto;padding:80px max(5vw,28px) 70px;background:radial-gradient(circle at 85% 22%,#deeffb 0,rgba(222,239,251,.28) 25%,transparent 44%)}.eyebrow{color:var(--blue);font-weight:600;font-size:13px}.hero h1{font-size:clamp(40px,5vw,62px);letter-spacing:-.05em;line-height:1.15;margin:15px 0;color:#13293d}.hero h1 em{font-style:normal;color:var(--blue)}.hero p{max-width:570px;color:var(--muted);font-size:17px;line-height:1.85}.btn-row{display:flex;gap:12px;margin:29px 0}.primary{border:1px solid var(--blue);background:var(--blue);color:#fff;border-radius:8px;padding:11px 17px;font-weight:600}.hero-visual{position:relative;min-height:335px}.ring{position:absolute;border:1px solid rgba(38,128,202,.2);border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}.r1{width:295px;height:295px}.r2{width:410px;height:410px}.chip,.progress{position:absolute;background:rgba(255,255,255,.93);border:1px solid #d6e7f2;border-radius:12px;box-shadow:0 15px 36px rgba(37,95,135,.12)}.chip{padding:15px;width:175px}.chip b,.chip small{display:block}.chip small{color:var(--muted);font-size:12px;margin-top:5px}.c1{top:38px;left:15px}.c2{right:5px;bottom:30px}.progress{width:205px;left:50%;top:50%;transform:translate(-50%,-50%);padding:21px;color:#fff;background:linear-gradient(140deg,#19527e,#1684d1);border:0}.progress span,.progress small{display:block;font-size:12px;opacity:.88}.progress strong{display:block;font-size:39px;margin:5px 0}.bar{display:flex;gap:5px;margin:13px 0}.bar i{height:5px;flex:1;border-radius:5px;background:rgba(255,255,255,.4)}.bar i:nth-child(-n+3){background:#fff}.section{max-width:1160px;padding:78px max(5vw,28px);margin:auto}.center{text-align:center}.section h2{margin:8px 0;font-size:clamp(27px,3vw,38px);letter-spacing:-.03em}.intro{max-width:650px;margin:14px auto 34px;color:var(--muted)}.role-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;text-align:left}.role-card{padding:30px;border-radius:14px;min-height:330px;display:flex;flex-direction:column}.enterprise{background:linear-gradient(135deg,#e8f5ff,#fbfdff);border:1px solid #d1e9fa}.worker{background:linear-gradient(135deg,#eaf8f2,#fbfefd);border:1px solid #d2eddf}.role-card .num{font-weight:700;color:var(--blue);font-size:13px}.worker .num{color:var(--green)}.role-card h3{font-size:25px;margin:10px 0}.role-card p{color:var(--blue);margin:20px 0 0}.worker p{color:var(--green)}.role-card ul{padding:0;list-style:none;color:#5e7487;line-height:2}.role-card li:before{content:"•";color:var(--blue);font-size:20px;margin-right:8px}.worker li:before{color:var(--green)}.text-btn{margin-top:auto;border:0;background:transparent;padding:0;color:var(--blue);font-weight:650;text-align:left}.worker .text-btn{color:var(--green)}.workflow{display:grid;grid-template-columns:.8fr 1.2fr;gap:70px;background:#fff;max-width:none;padding-left:max(calc((100vw - 1160px)/2),5vw);padding-right:max(calc((100vw - 1160px)/2),5vw)}.steps article{display:flex;gap:18px;padding:17px 0;border-bottom:1px solid var(--line)}.steps b{color:var(--blue)}.steps h3{margin:0 0 6px;font-size:17px}.steps p{margin:0;color:var(--muted)}.assurance{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.assurance article{border-top:2px solid #74b9e8;padding:15px 5px}.assurance b,.assurance span{display:block}.assurance span{font-size:13px;color:var(--muted);margin-top:8px}.footer{display:flex;align-items:center;gap:18px;padding:22px max(5vw,28px);border-top:1px solid var(--line);background:#fff;color:#8494a1;font-size:13px}.internal{margin-left:auto;border:0;background:none;color:#93a1ac;font-size:12px}
    .app{min-height:100vh}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;gap:16px}.tag{margin-left:auto;color:var(--muted);font-size:13px}.back{border:0;background:none;color:var(--blue)}.layout{display:grid;grid-template-columns:190px 1fr}.side{background:var(--deep);min-height:calc(100vh - 68px);padding:20px 13px}.side p{color:#a8c3d6;font-size:13px;margin:0 9px 12px}.side button{display:block;width:100%;border:0;border-radius:7px;padding:10px;background:transparent;color:#cedce6;text-align:left;margin-bottom:3px}.side button.active,.side button:hover{background:#214764;color:#fff}.main{max-width:1180px;width:100%;padding:26px 32px}.crumb{color:var(--muted);font-size:13px}.heading{display:flex;justify-content:space-between;gap:15px;align-items:start}.heading h1{font-size:28px;margin:5px 0}.heading p{margin:0;color:var(--muted)}.metrics,.actions,.jobs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:24px}.metric,.action,.job{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:17px;text-align:left}.metric span,.metric small,.action small{display:block;color:var(--muted);font-size:13px}.metric strong{display:block;font-size:28px;margin:7px 0}.action:hover,.metric:hover,.job:hover{border-color:var(--blue)}.action b{display:block;margin:8px 0}.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin:24px 0 15px}.tabs button{padding:9px 0;border:0;background:none;color:var(--muted)}.tabs .selected{color:var(--blue);border-bottom:2px solid var(--blue)}.table{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff}.table table{min-width:680px;width:100%;border-collapse:collapse;text-align:left}.table th,.table td{padding:13px 15px;border-bottom:1px solid var(--line);font-size:14px}.table th{background:#f7fafc;color:var(--muted);font-weight:500}.state{display:inline-block;padding:3px 8px;border-radius:99px;background:#e9f5ff;color:var(--blue);font-size:12px}.link{border:0;background:none;color:var(--blue);padding:0}.card,.form{max-width:780px;margin-top:24px;padding:22px;border:1px solid var(--line);border-radius:10px;background:#fff}.card h2,.form h2{margin:0 0 16px;font-size:18px}.row{display:flex;justify-content:space-between;padding:11px 0;border-top:1px solid var(--line);gap:15px}.row span{color:var(--muted)}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.form label{font-size:14px}.form input,.form select,.form textarea{margin-top:6px;width:100%;padding:9px;border:1px solid var(--line);border-radius:7px}.wide{grid-column:span 2}.form-foot{display:flex;justify-content:flex-end;margin-top:20px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#183249;color:#fff;padding:10px 15px;border-radius:8px}
    @media(max-width:760px){.home-nav{height:63px;padding:0 20px}.home-nav nav{display:none}.nav-btn{margin-left:auto}.hero{grid-template-columns:1fr;padding:48px 22px}.hero h1{font-size:40px}.hero p{font-size:15px}.hero-visual{min-height:265px;transform:scale(.88);margin:-10px auto -25px}.role-grid,.workflow,.assurance,.metrics,.actions,.jobs,.form-grid{grid-template-columns:1fr}.section{padding:60px 22px}.workflow{padding:60px 22px;gap:28px}.footer{padding:18px 22px}.footer>span{display:none}.layout{grid-template-columns:1fr}.side{min-height:0;display:flex;overflow:auto;padding:9px}.side p{display:none}.side button{width:auto;white-space:nowrap;margin:0}.main{padding:21px 18px}.heading{flex-direction:column}.form .wide{grid-column:span 1}.top{padding:0 18px}.tag{display:none}.role-card{min-height:290px}}
  </style>
</head>
<body>
<div id="root"></div>
<script>
  const root=document.getElementById('root');let role=null,view='dashboard',toast='';
  const menus={enterprise:[['dashboard','工作台'],['register','开户注册'],['auth','企业认证'],['projects','项目管理'],['tasks','任务管理'],['workers','零客管理'],['orders','订单中心'],['finance','财务管理']],worker:[['home','首页'],['login','登录 / 注册'],['verify','实名认证'],['bank','我的银行卡'],['jobs','任务中心'],['income','我的收入'],['profile','个人中心']],admin:[['dashboard','运营工作台'],['review','审核管理'],['companies','企业管理'],['people','零客管理'],['orders','订单管理'],['invoices','发票管理']]};
  function go(x){view=x;render()}function enter(x){role=x;view=x==='worker'?'home':'dashboard';render()}function message(x){toast=x;render();setTimeout(()=>{toast='';render()},1600)}function btn(label,target,primary=true){return `<button class="${primary?'primary':'secondary'}" onclick="go('${target}')">${label}</button>`}
  function home(){return `<main class="home"><header class="home-nav"><div class="brand"><span class="mark">L</span>灵工云</div><nav><a href="#enterprise">企业服务</a><a href="#worker">自由职业者</a><a href="#how">服务流程</a><a href="#security">服务保障</a></nav><button class="nav-btn" onclick="enter('enterprise')">企业登录</button></header><section class="hero"><div><div class="eyebrow">让灵活协作，更高效、更安心</div><h1>连接企业与人才<br><em>让每一次合作都有保障</em></h1><p>为企业提供任务发布、人员协作、结算支付与票据管理的一体化服务；为自由职业者提供可信任务、清晰收入与便捷结算体验。</p><div class="btn-row"><button class="primary" onclick="enter('enterprise')">企业开始用工　→</button><button class="secondary" onclick="enter('worker')">我是自由职业者</button></div></div><div class="hero-visual"><i class="ring r1"></i><i class="ring r2"></i><div class="chip c1"><b>企业</b><small>发布需求 · 管理协作</small></div><div class="chip c2"><b>人才</b><small>发现任务 · 获得收入</small></div><div class="progress"><span>本月协作进度</span><strong>68%</strong><div class="bar"><i></i><i></i><i></i><i></i></div><small>任务执行 · 结算 · 发票</small></div></div></section><section class="section center"><div class="eyebrow">选择您的服务入口</div><h2>为主要参与者，设计不同的协作体验</h2><p class="intro">不论您需要组织弹性人力，还是正在寻找可靠的合作机会，灵工云都为您准备了清晰的服务路径。</p><div class="role-grid"><article id="enterprise" class="role-card enterprise"><span class="num">01</span><p>用工企业</p><h3>统一管理每一次用工协作</h3><ul><li>创建项目，快速发布任务</li><li>查看人员报名与执行进度</li><li>在线发起结算、支付与开票申请</li></ul><button class="text-btn" onclick="enter('enterprise')">进入企业服务　→</button></article><article id="worker" class="role-card worker"><span class="num">02</span><p>自由职业者</p><h3>发现合适机会，安心完成服务</h3><ul><li>完成认证，浏览匹配任务</li><li>在线确认接单，跟进服务进度</li><li>查看收入明细，便捷申请提现</li></ul><button class="text-btn" onclick="enter('worker')">进入个人服务　→</button></article></div></section><section class="section workflow" id="how"><div><div class="eyebrow">一体化协作流程</div><h2>从需求到结算，让复杂流程更清晰</h2></div><div class="steps"><article><b>01</b><div><h3>发布与匹配</h3><p>企业明确服务需求，人才浏览并报名合适任务。</p></div></article><article><b>02</b><div><h3>执行与确认</h3><p>双方在线跟进服务进度，关键节点清晰可见。</p></div></article><article><b>03</b><div><h3>结算与留存</h3><p>按项目或周期发起结算，订单和票据状态集中管理。</p></div></article></div></section><section class="section" id="security"><div class="eyebrow">服务保障</div><h2>围绕每一笔协作，建立可见的信任</h2><div class="assurance"><article><b>流程标准化</b><span>认证、任务、订单到结算，关键环节统一留痕。</span></article><article><b>状态透明化</b><span>企业与个人均可查看任务、订单和收入的当前进度。</span></article><article><b>服务有响应</b><span>为常见业务问题提供清晰操作与消息提醒。</span></article></div></section><footer class="footer"><div class="brand"><span class="mark">L</span>灵工云</div><span>社会化灵活用工协同平台 · 本地原型</span><button class="internal" onclick="enter('admin')">运营人员入口</button></footer></main>`}
  const taskRows=[['灵活用工运营支持','RW20260721001','进行中','¥30,000'],['夏季品牌活动执行','RW20260718012','待审核','¥18,000'],['客服外包项目','RW20260716009','已完成','¥42,000']];function table(rows,kind='任务'){return `<div class="table"><table><thead><tr><th>${kind}名称</th><th>编号</th><th>状态</th><th>金额 / 时间</th><th>操作</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td><span class="state">${x[2]}</span></td><td>${x[3]}</td><td><button class="link" onclick="go('detail')">查看详情</button></td></tr>`).join('')}</tbody></table></div>`}function list(title,rows,add,target,kind){return `<p class="crumb">首页 / ${title}</p><div class="heading"><div><h1>${title}</h1><p>查看、管理和跟踪对应业务数据。</p></div>${btn(add,target)}</div><div class="tabs"><button class="selected">全部</button><button>待审核</button><button>进行中</button><button>已完成</button></div>${table(rows,kind)}`}
  function form(title,next){return `<p class="crumb">首页 / ${title}</p><form class="form" onsubmit="event.preventDefault();message('提交成功，已进入下一环节');go('${next}')"><h2>${title}</h2><div class="form-grid"><label>名称<input value="${title==='发布任务'?'活动运营专员':'杭州星澜科技有限公司'}"></label><label>业务类型<select><option>现代服务</option><option>运营推广</option></select></label><label>金额 / 周期<input value="¥ 30,000"></label><label>联系人<input value="138 0000 2026"></label><label class="wide">说明<textarea>请填写相关业务信息与协作要求。</textarea></label></div><div class="form-foot"><button class="primary">提交并继续</button></div></form>`}function detail(){return `<p class="crumb">首页 / 详情</p><div class="heading"><div><h1>${role==='worker'?'短视频内容运营':role==='admin'?'杭州星澜科技有限公司':'灵活用工运营支持'}</h1><p><span class="state">${role==='admin'?'待审核':role==='worker'?'报名中':'进行中'}</span></p></div><div>${role==='worker'?btn('立即报名','accept'):role==='admin'?`<button class="secondary" onclick="message('已记录驳回意见')">驳回</button> <button class="primary" onclick="message('审核已通过，企业端已收到通知');go('review')">审核通过</button>`:btn('创建结算订单','payment')}</div></div><section class="card"><h2>基本信息</h2><div class="row"><span>编号</span><b>RW20260721001</b></div><div class="row"><span>服务报酬</span><b>¥30,000</b></div><div class="row"><span>执行周期</span><b>2026-08-01 至 2026-08-31</b></div><div class="row"><span>当前进度</span><b>68%</b></div></section>`}
  function dashboard(){let a=role==='admin'?[['入驻企业','2,486','review'],['认证零客','126,839','people'],['本月交易额','¥846万','orders']]:role==='worker'?[['推荐任务','18','jobs'],['进行中','2','jobs'],['本月收入','¥8,426','income']]:[['任务总数','128','tasks'],['进行中任务','36','tasks'],['待付款金额','¥128,600','orders']];return `<p class="crumb">首页 / 工作台</p><div class="heading"><div><h1>${role==='admin'?'平台运营工作台':role==='worker'?'零工任务大厅':'企业用工工作台'}</h1><p>从任务协作到结算管理，关键业务状态一目了然。</p></div>${btn(role==='worker'?'浏览任务':role==='admin'?'企业认证审核':'发布任务',role==='worker'?'jobs':role==='admin'?'review':'publish')}</div><div class="metrics">${a.map(x=>`<button class="metric" onclick="go('${x[2]}')"><span>${x[0]}</span><strong>${x[1]}</strong><small>点击查看详情</small></button>`).join('')}</div><div class="actions">${a.map((x,i)=>`<button class="action" onclick="go('${x[2]}')"><small>0${i+1}</small><b>${x[0]}</b><small>进入相关流程</small></button>`).join('')}</div>`}
  function content(){if(role==='enterprise'){if(view==='dashboard')return dashboard();if(view==='register')return form('企业开户注册','auth');if(view==='auth')return form('企业实名认证','dashboard');if(view==='publish')return form('发布任务','tasks');if(view==='projects')return list('项目管理',[['2026年灵活用工服务项目','PJ20260721001','进行中','2026-07-21']], '创建项目','projects');if(view==='tasks')return list('任务管理',taskRows,'发布任务','publish');if(view==='workers')return list('零客管理',[['林晓','WK20260702001','合作中','内容运营'],['张宇','WK20260702002','已合作','活动执行']],'登记零客','workers','零客');if(view==='orders')return list('订单中心',[['灵活用工运营支持','DD202607210021','待付款','¥30,000']],'创建订单','payment','订单');if(view==='payment')return form('支付确认','finance');if(view==='finance')return list('财务管理',[['订单结算','TR202607210021','支付成功','¥30,000']],'申请发票','invoice','交易');if(view==='invoice')return form('申请发票','finance');return detail()}if(role==='worker'){if(view==='dashboard'||view==='home'||view==='jobs')return dashboard();if(view==='login')return form('手机号登录 / 注册','verify');if(view==='verify')return form('实名认证','bank');if(view==='bank')return form('绑定银行卡','jobs');if(view==='income')return list('我的收入',[['短视频内容运营','IN20260722001','待结算','¥6,000'],['活动协助结算','IN20260718018','已到账','¥1,680']],'申请提现','withdraw','收入');if(view==='withdraw')return form('提现','income');if(view==='profile')return detail();if(view==='accept')return form('确认接单','jobs');return detail()}if(view==='dashboard')return dashboard();if(view==='review')return list('企业认证审核',[['杭州星澜科技有限公司','91330100MA2B8X9K6A','待审核','2026-07-21']],'批量审核','review','企业');if(view==='companies')return list('企业管理',[['杭州星澜科技有限公司','CP202607001','正常','余额 ¥128,600']],'导出企业','companies','企业');if(view==='people')return list('零客管理',[['林晓','WK20260702001','已认证','累计 ¥28,600']],'导出名单','people','零客');if(view==='orders')return list('全平台订单',[['灵活用工运营支持','DD202607210021','待付款','¥30,000']],'批量导出','orders','订单');if(view==='invoices')return list('发票管理',[['杭州星澜科技有限公司','INV20260721001','待开票','¥30,000']],'批量开票','invoices','发票申请');return detail()}
  function app(){let label=role==='enterprise'?'企业端':role==='worker'?'个人端':'运营后台';return `<main class="app"><header class="top"><button class="brand" onclick="role=null;render()"><span class="mark">L</span>灵工云</button><span class="tag">${label}</span><button class="back" onclick="role=null;render()">返回入口</button></header><div class="layout"><aside class="side"><p>${label}</p>${menus[role].map(x=>`<button class="${view===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}</aside><section class="main">${content()}</section></div>${toast?`<div class="toast">${toast}</div>`:''}</main>`}function render(){root.innerHTML=role?app():home()}render();
</script>
</body>
</html>
